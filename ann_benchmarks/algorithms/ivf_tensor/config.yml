float:
  any:
  - base_args: ['@metric']
    constructor: IVFTensor
    disabled: false
    docker_tag: ann-benchmarks-ivf_tensor
    module: ann_benchmarks.algorithms.ivf_tensor
    name: ivf_tensor
    run_groups:
      # # 默认配置：自动选择 n_lists
      # default:
      #   arg_groups: [{}]
      #   args: {}
      #   query_args: [[1, 5, 10, 20, 40]]
      
      # # 固定 n_lists=100（batch_size 为查询时每批条数，None 表示一次全量）
      lists-100:
        arg_groups: [{kmeans_iters: 20, n_lists: 100, batch_size: 1000}]
        args: {}
        query_args: [[10, 20, 40]]
      
      # 固定 n_lists=1000
      lists-1000:
        arg_groups: [{kmeans_iters: 20, n_lists: 1000, batch_size: 1000}]
        args: {}
        query_args: [[10, 20, 40]]
      
      # 固定 n_lists=10000
      lists-10000:
        arg_groups: [{kmeans_iters: 20, n_lists: 10000, batch_size: 1000}]
        args: {}
        query_args: [[10, 20, 40]]




